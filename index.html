<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cabeceras de Seguridad HTTP (OWASP A02: Security Misconfiguration) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; frame-ancestors 'self';" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains" />

    <!-- Favicon de la marca -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Título y SEO básico -->
    <title>Kyrios Studio | Barbería</title>
    <meta name="description" content="Kyrios Studio — Barbería de alto estándar en Popayán, Cauca. Cortes, arreglo de barba y más. Reserva tu cita online." />
    <meta name="theme-color" content="#0C0C0C" />

    <!-- Open Graph básico -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kyrios Studio | Barbería" />
    <meta property="og:description" content="Barbería de alto estándar en Popayán. Cortes, barba y estilo con los mejores profesionales." />
    <meta property="og:locale" content="es_CO" />

    <!-- Inicialización inmediata de tema para prevenir parpadeo (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app-theme');
          var theme = (saved === 'dark' || saved === 'light')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
