# ==============================================================================
# TÉCNICA DE TESTING / SEGURIDAD: SAST (Static Application Security Testing)
# + Verificación de Calidad, Cobertura y Quality Gate
# ==============================================================================
# Propósito:
#   Análisis estático de código fuente propio ("Caja Blanca" / White-box) sin ejecutar
#   la aplicación en un entorno de producción o runtime.
# Rol en la arquitectura:
#   - SonarCloud / SonarQube: Rastrea vulnerabilidades de seguridad en el código
#     (OWASP Top 10, CWEs), fallos de lógica (Bugs), puntos calientes (Security Hotspots)
#     y complejidad ciclomática/cognitiva.
#   - Build & Tests: Compila la aplicación y ejecuta pruebas unitarias/componente con
#     generación de reporte de cobertura (LCOV) para validar el Sonar Quality Gate (> 80%).
# Momento de activación:
#   - En cada push a ramas principales y ramas de características configuradas.
#   - En cada Pull Request al abrirse o sincronizarse.
# ==============================================================================

name: Build
on:
  push:
    branches:
      - master
      - main
      - feature/multitenant-core-fixes
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
