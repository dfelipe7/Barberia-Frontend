# ==============================================================================
# TÉCNICA DE TESTING / SEGURIDAD: SCA (Software Composition Analysis)
# Subtipo: Quality Gate / Bloqueador de Seguridad en CI/CD (OWASP A06 / A03)
# ==============================================================================
# Propósito:
#   Auditoría de composición de software de código abierto y dependencias de terceros (npm).
# Rol en la arquitectura:
#   Actúa como un "Inspector / Guardia de Entrada". Si se introduce o detecta una
#   dependencia con vulnerabilidades conocidas (CVEs) de severidad ALTA o CRÍTICA
#   en package-lock.json, este job falla de inmediato (código de salida > 0) y bloquea
#   el Pull Request o el pipeline de despliegue.
# Momento de activación:
#   - En cada push a ramas principales (master, main).
#   - En cada Pull Request.
#   - Programado periódicamente (cron semanal: lunes a la medianoche).
# ==============================================================================

name: Security Audit Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * 1' # Ejecutar cada lunes

jobs:
  npm-audit:
    name: OWASP A03 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Escaneo de Seguridad (Falla si hay Críticos o Altos)
        run: npm audit --audit-level=high
