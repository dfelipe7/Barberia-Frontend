server {
    listen 80;
    server_name localhost;

    # Cabeceras de Seguridad HTTP (OWASP Top 10:2025 A02: Security Misconfiguration)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:3000 http://localhost:8080 https://barberia-backend-production.up.railway.app https://keycloak-production-4cdb.up.railway.app; frame-src 'self' https://www.google.com https://keycloak-production-4cdb.up.railway.app; form-action 'self' https://keycloak-production-4cdb.up.railway.app http://localhost:8080; frame-ancestors 'self';" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
