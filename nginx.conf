server {
    listen 80;
    server_name localhost;

    # Cabeceras de Seguridad HTTP Globales (OWASP Top 10:2025 A02: Security Misconfiguration)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://lh3.googleusercontent.com http://localhost:3000; connect-src 'self' https://accounts.google.com http://localhost:3000 https://barberia-backend-production.up.railway.app; frame-src 'self' https://accounts.google.com https://www.google.com; form-action 'self'; frame-ancestors 'self';" always;

    # 1. Assets estáticos generados por Vite con hash de contenido único (inmutables por 1 año)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://lh3.googleusercontent.com http://localhost:3000; connect-src 'self' https://accounts.google.com http://localhost:3000 https://barberia-backend-production.up.railway.app; frame-src 'self' https://accounts.google.com https://www.google.com; form-action 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 2. index.html: NUNCA almacenar en caché para asegurar que el navegador siempre descargue los hashes JS del último deploy
    location = /index.html {
        root /usr/share/nginx/html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://lh3.googleusercontent.com http://localhost:3000; connect-src 'self' https://accounts.google.com http://localhost:3000 https://barberia-backend-production.up.railway.app; frame-src 'self' https://accounts.google.com https://www.google.com; form-action 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # 3. Fallback de Single Page Application (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://lh3.googleusercontent.com http://localhost:3000; connect-src 'self' https://accounts.google.com http://localhost:3000 https://barberia-backend-production.up.railway.app; frame-src 'self' https://accounts.google.com https://www.google.com; form-action 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
