sonar.projectKey=dfelipe7_Barberia-Frontend
sonar.organization=dfelipe7

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Barberia-Frontend
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.spec.tsx,src/**/*.test.ts,src/**/*.test.tsx

# Coverage report for SonarCloud
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,public/**,src/test/**,**/*.css
sonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/**/*.types.ts,src/**/*.d.ts,src/**/*.dto.ts,src/**/*.keys.ts,src/**/*.schema.ts,src/**/*.facade.ts,src/**/index.ts,src/test/**,src/**/*.css,**/pages/**,**/components/**,**/ui/**,**/layout/**,**/routes/**,**/context/**,**/contexts/**,**/auth/**,src/pages/**,src/**/pages/**,src/components/**,src/**/components/**,src/shared/ui/**,src/shared/layout/**,src/shared/routes/**,src/**/context/**,src/**/contexts/**,src/shared/lib/use*.ts,src/shared/lib/setBodyScrollLock.ts,src/shared/lib/queryClient.ts,src/shared/lib/autorizacion/roles.ts,src/auth/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
